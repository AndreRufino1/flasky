{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Hello, {% if name %}{{ name }}{% else %}Stranger{% endif %}!</h1>
</div>

<form method="POST">
    {{ form.hidden_tag() }}
    <div class="form-group">
        {{ form.name.label(class="control-label") }}
        {{ form.name(class="form-control") }}
    </div>
    {{ form.submit(class="btn btn-default") }}
</form>
{% endblock %}
