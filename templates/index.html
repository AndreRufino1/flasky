<!-- Avisa o Flask para herdar o menu do base.html -->
{% extends "base.html" %}

{% block content %}
    <div class="mb-4">
        <h2>Dados da última atualização:</h2>
        <hr>
    </div>
    <!-- Exibe a data formatada e o tempo -->
    <p>The local date and time is {{ moment(current_time).format('LLL') }}.</p>
    <p>That was {{ moment(current_time).fromNow() }}.</p>
{% endblock %}
